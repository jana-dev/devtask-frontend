<header class="dashboard-header">
  <div class="dashboard-header__brand">
    <span class="dashboard-header__logo">◈</span>
    <span>DevTask AI</span>
  </div>

  <div class="dashboard-header__user">
    <span>👤</span>
    <span>Janaina</span>
  </div>
</header>

<main class="dashboard">
  <section class="dashboard__welcome">
    <h1>Olá, Janaina 👋</h1>
    <p>Aqui está um resumo dos seus projetos.</p>
  </section>

  <section class="dashboard__summary">
    @for (card of summaryCards; track card.title) {
      <app-summary-card
        [title]="card.title"
        [value]="card.value"
      />
    }
  </section>

  <section class="dashboard__projects">
    <h2>Meus projetos</h2>

    <div class="dashboard__project-list">
      @for (project of projects; track project.name) {
        <app-project-card [project]="project" />
      }
    </div>
  </section>
</main>
